services:
  backend:
    build: ./backend
    container_name: talentiq-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: talentiq-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: talentiq-redis
    ports:
      - "6379:6379"
    restart: unless-stopped